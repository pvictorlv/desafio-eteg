name: Imagem

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRO: ghcr.io

jobs:
  publicar:
    name: Publica no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # O único privilégio de escrita do workflow. Sem `id-token` nem
      # `contents: write`: publicar imagem não precisa de nenhum dos dois.
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: etiquetas
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository }}
          # `latest` acompanha a main; a tag semântica fixa uma versão para
          # quem precisa voltar atrás sem adivinhar qual commit era.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.etiquetas.outputs.tags }}
          labels: ${{ steps.etiquetas.outputs.labels }}
          # O cache do próprio GitHub: sem ele cada publicação reinstala as
          # dependências do zero.
          cache-from: type=gha
          cache-to: type=gha,mode=max
