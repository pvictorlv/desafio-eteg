version: 2

updates:
  # Um pull request por semana com as atualizações agrupadas. Um PR por
  # pacote, todo dia, é ruído que o time aprende a ignorar — e aí a
  # atualização de segurança passa despercebida junto.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # O @types/node acompanha a major do runtime, e o runtime está em 24
      # (veja o .nvmrc). Tipagem à frente do runtime compila métodos que não
      # existem em produção — o erro só aparece quando alguém chama.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: build
